name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Check generated index and grammar
        run: git diff --exit-code -- lithe-plugin-index.json io.github.colddustxss.frontend-support/grammars
      - name: Check out pinned official Store rules
        uses: actions/checkout@v4
        with:
          repository: Lithe-IDEA/Lithe-store
          ref: 722a1c28b4dedd0fcd450e636b183a81aff093ca
          path: .cache/lithe-store
          persist-credentials: false
      - name: Validate with official Store rules (Lua template flow)
        run: npm run validate-store -- .cache/lithe-store/scripts/validate-index.mjs
